name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Build
        run: chmod +x ./gradlew && ./gradlew detekt assembleRelease --stacktrace

      # APKs are unsigned: no signing secrets in this repo yet
      - uses: actions/upload-artifact@v4
        with:
          name: mpvkt-rolling-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
